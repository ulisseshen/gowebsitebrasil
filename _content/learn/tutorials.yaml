# ia-translated: true
- title: Começando
  content: Neste tutorial, você terá uma breve introdução à programação Go. Ao longo do caminho, você instalará Go, escreverá algum código simples "Hello, world", usará o comando go para executar seu código, usará a ferramenta de descoberta de pacotes Go e chamará funções de um módulo externo.
  url: /doc/tutorial/getting-started
  thumbnail:
  cta: Tutorial
- title: Criar um módulo
  content: Esta é a primeira parte de um tutorial que introduz alguns recursos fundamentais da linguagem Go. Neste tutorial, você criará dois módulos. O primeiro é uma biblioteca que se destina a ser importada por outras bibliotecas ou aplicações. O segundo é uma aplicação chamadora que usará o primeiro.
  url: /doc/tutorial/create-module
  thumbnail:
  cta: Tutorial
- title: Desenvolvendo um web service
  content: Este tutorial introduz os conceitos básicos de escrever uma API de web service RESTful com Go e o Gin Web Framework. Neste tutorial, você construirá um servidor API RESTful com dois endpoints.
  url: https://shell.cloud.google.com/?walkthrough_tutorial_url=https%3A%2F%2Fraw.githubusercontent.com%2Fgolang%2Ftour%2Fmaster%2Ftutorial%2Fweb-service-gin.md&pli=1&show=ide&environment_deployment=ide
  thumbnail:
  cta: Tutorial Interativo
- title: Acessando um banco de dados relacional
  content: Este tutorial introduz os conceitos básicos de acessar um banco de dados relacional com Go e o pacote database/sql em sua biblioteca padrão. Neste tutorial, você criará um banco de dados e, em seguida, escreverá código para acessar o banco de dados.
  url: /doc/tutorial/database-access
  thumbnail:
  cta: Tutorial
